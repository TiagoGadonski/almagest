services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almagest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almagest_dev}
      POSTGRES_DB: ${POSTGRES_DB:-almagest}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - almagest_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-almagest} -d ${POSTGRES_DB:-almagest}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Built here, not read from .env: the container reaches Postgres over
      # the compose network as "db", not "localhost".
      ALMAGEST_CONNECTION_STRING: Host=db;Port=5432;Username=${POSTGRES_USER:-almagest};Password=${POSTGRES_PASSWORD:-almagest_dev};Database=${POSTGRES_DB:-almagest}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-4}

volumes:
  almagest_pgdata:

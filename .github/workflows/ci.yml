name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Almagest.sln

      - name: Build
        run: dotnet build Almagest.sln --no-restore --configuration Release

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Almagest.sln

      - name: Unit tests
        # No secret is required for this job -- every unit test runs
        # against faked ports, no network or database call.
        run: >
          dotnet test tests/Almagest.UnitTests/Almagest.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tests/Almagest.UnitTests/TestResults/*.trx

  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Almagest.sln

      - name: Almagest.Application coverage gate
        # Threshold measured against this repo's real Application-layer
        # coverage (89.2% line at the time this workflow was written) --
        # 80% leaves real headroom rather than being a round-number guess.
        run: >
          dotnet test tests/Almagest.UnitTests/Almagest.UnitTests.csproj
          --configuration Release
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          "-p:Include=[Almagest.Application]*"
          -p:Threshold=80
          -p:ThresholdType=line
          -p:ThresholdStat=total

  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Almagest.sln

      # Optional: without this, Testcontainers pulls pgvector/pgvector:pg16
      # anonymously, sharing Docker Hub's 100-pulls-per-6-hours-per-IP limit
      # with every other job running on GitHub's shared runner IP pool --
      # a real, commonly-hit source of CI flakiness for Testcontainers-based
      # workflows, not a hypothetical one. Authenticating raises that to
      # 5,000/day. Guarded so the job still runs without these secrets --
      # see docs/deployment/ci-secrets.md.
      - name: Log in to Docker Hub (avoids Testcontainers pull rate limits)
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Integration tests
        # Testcontainers pulls pgvector/pgvector:pg16 and runs it for real --
        # GitHub-hosted runners have Docker available out of the box. No
        # API-key secret required: embeddings used here are hand-built
        # float[] arrays (docs/phases/05-production.md §3.1), not real
        # model calls.
        run: dotnet test tests/Almagest.IntegrationTests/Almagest.IntegrationTests.csproj --configuration Release

  docker-build:
    # Independent of the build/test jobs above: this validates the actual
    # artifact `fly deploy` builds from (the multi-stage Dockerfile), which
    # nothing else in this workflow exercises. A green build/unit-tests/
    # integration-tests run proves the .NET code works; it says nothing
    # about whether the container image that gets deployed even builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the deployable image
        run: docker build -t almagest-api:ci .

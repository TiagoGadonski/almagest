# fly.toml app configuration file generated for almagest on 2026-08-17T17:15:29-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'almagest'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ANTHROPIC_MODEL = 'claude-haiku-4-5'
  VOYAGE_MODEL = 'voyage-4'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
